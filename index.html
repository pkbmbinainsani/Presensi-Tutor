<!doctype html>
<html lang="id">
  <head>
    <script>
      (function() {
        const filterVite = function(originalFn) {
          return function(...args) {
            const fullMsg = args.map(arg => {
              if (typeof arg === 'string') return arg;
              if (arg && arg.message) return arg.message;
              return '';
            }).join(' ');
            if (fullMsg.includes('[vite]') || fullMsg.toLowerCase().includes('websocket')) {
              return;
            }
            return originalFn.apply(console, args);
          };
        };
        console.error = filterVite(console.error);
        console.warn = filterVite(console.warn);

        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.includes('[vite]') || event.message.toLowerCase().includes('websocket'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
